<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mbpsito.io Velocidad de Red</title>
     <link rel="icon" type="image/png" href="favicon.png">
    <!-- Librería Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #3e5b7970;
            color: #fdfdfd;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .main-app-container {
            width: 100%;
            max-width: 450px;
        }

        .speed-container {
            text-align: center;
            background: #161922;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 255, 204, 0.1);
            margin-bottom: 15px;
        }

        /* Estilo interactivo para el contenedor del Logo */
        .logo-header {
            margin-bottom: 15px;
        }

        .logo-header img {
            max-width: 250px; /* Logo más grande (antes estaba en 200px) */
            height: auto;
            display: inline-block;
            filter: drop-shadow(0 0 8px rgba(0, 255, 204, 0.3));
            cursor: pointer;
            /* Transición suave para el cambio de tamaño */
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Efecto al pasar el ratón por encima (Hover) */
        .logo-header img:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 12px rgba(0, 255, 204, 0.5));
        }

        /* Efecto al hacer clic o presionar con el dedo (Active) */
        .logo-header img:active {
            transform: scale(0.95);
        }

        /* Información de Red / Proveedor */
        .network-info {
            background: #1f2330;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #00ffcc;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 204, 0.1);
            display: inline-block;
        }

        .speed-wrapper {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 10px;
        }

        .speed-box { 
            font-size: clamp(3rem, 10vw, 4rem); 
            font-weight: 800; 
            color: #00ffcc; 
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            line-height: 1;
        }

        #speed-unit { 
            font-size: 1.2rem; 
            color: #8892b0; 
            font-weight: 600; 
            text-transform: uppercase;
        }

        .status { 
            font-size: 0.95rem; 
            margin: 15px 0; 
            font-weight: 600; 
            min-height: 24px; 
            color: #8892b0;
        }

        /* Métricas secundarias (Ping, Subida) */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: #1f2330;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .metric-title {
            font-size: 0.75rem;
            color: #8892b0;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        button {
            background: linear-gradient(135deg, #00ffcc, #00b386);
            color: #0d0f12;
            border: none;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.3);
            transition: all 0.3s ease;
        }

        button:hover { 
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 255, 204, 0.5);
        }
        button:active { transform: scale(0.98); }
        button:disabled { background: #2a2e3d; color: #5c647a; cursor: not-allowed; box-shadow: none; }

        /* Controles para mostrar/ocultar gráfica */
        .controls {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .toggle-chart-btn {
            background: #161922;
            border: 1px solid rgba(0, 255, 204, 0.2);
            color: #8892b0;
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            width: auto;
            box-shadow: none;
            transition: 0.3s;
        }

        .toggle-chart-btn:hover {
            border-color: #00ffcc;
            color: #00ffcc;
            transform: none;
            box-shadow: none;
        }

        .chart-container {
            background: #161922;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 204, 0.05);
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            transition: all 0.3s ease;
        }

        .hidden {
            display: none;
        }

        @media (min-width: 600px) {
            .main-app-container {
                max-width: 480px;
            }
            .speed-container, .chart-container {
                padding: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="main-app-container">
        <div class="speed-container">
            <!-- Logo integrado con interactividad -->
            <div class="logo-header">
                <img src="Logo.png" alt="Mbpsito.io Logo">
            </div>
            
            <!-- Indicador de Red / Proveedor -->
            <div id="network-provider" class="network-info">Detectando proveedor...</div>

            <div class="speed-wrapper">
                <div class="speed-box" id="speed-value">0.00</div>
                <div id="speed-unit">Mbps</div>
            </div>
            <div id="status-text" class="status">Presiona Iniciar!</div>

            <!-- Panel de Ping y Subida -->
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-title">Ping</div>
                    <div class="metric-value" id="ping-value">-- ms</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Subida (Upload)</div>
                    <div class="metric-value" id="upload-value">-- Mbps</div>
                </div>
            </div>

            <button id="toggle-btn">Iniciar Prueba</button>
        </div>

        <!-- Botón para alternar la gráfica -->
        <div class="controls">
            <button class="toggle-chart-btn" onclick="toggleChart()">📊 Mostrar / Ocultar Gráfica</button>
        </div>

        <!-- Contenedor de la gráfica -->
        <div id="chart-wrapper" class="chart-container">
            <canvas id="speedChart"></canvas>
        </div>
    </div>

    <script>
        const speedValue = document.getElementById('speed-value');
        const statusText = document.getElementById('status-text');
        const toggleBtn = document.getElementById('toggle-btn');
        const pingValue = document.getElementById('ping-value');
        const uploadValue = document.getElementById('upload-value');
        const networkProvider = document.getElementById('network-provider');
        let isTesting = false;

        // Función para mostrar/ocultar gráfica
        function toggleChart() {
            const chartWrapper = document.getElementById('chart-wrapper');
            chartWrapper.classList.toggle('hidden');
        }

        // Detectar Proveedor de Internet (ISP) al cargar la página
        async function detectISP() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                if (data && data.org) {
                    networkProvider.textContent = `Red / ISP: ${data.org} (${data.city || 'Desconocido'})`;
                } else {
                    networkProvider.textContent = "Red: Conexión Directa";
                }
            } catch (e) {
                networkProvider.textContent = "Red: Proveedor Local";
            }
        }

        detectISP();

        function playClickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);

                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.08);
            } catch (e) {
                console.log("Audio not supported", e);
            }
        }

        // Configuración de la Gráfica
        const ctx = document.getElementById('speedChart').getContext('2d');
        const gradientFill = ctx.createLinearGradient(0, 0, 0, 250);
        gradientFill.addColorStop(0, 'rgba(0, 255, 204, 0.4)');
        gradientFill.addColorStop(1, 'rgba(0, 255, 204, 0.0)');

        const speedChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Ancho de Banda (Mbps)',
                    data: [],
                    borderColor: '#00ffcc',
                    borderWidth: 3,
                    backgroundColor: gradientFill,
                    fill: true,
                    tension: 0.4,
                    pointBackgroundColor: '#00ffcc',
                    pointBorderColor: '#0d0f12',
                    pointBorderWidth: 2,
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                scales: {
                    y: { 
                        beginAtZero: true, 
                        grid: { color: 'rgba(255, 255, 255, 0.05)' }, 
                        ticks: { color: '#8892b0', font: { size: 10 } } 
                    },
                    x: { 
                        grid: { display: false }, 
                        ticks: { color: '#8892b0', font: { size: 10 } } 
                    }
                },
                plugins: { 
                    legend: { labels: { color: '#ffffff', font: { size: 11, weight: '600' } } } 
                }
            }
        });

        async function startSpeedTest() {
            if (isTesting) return;
            playClickSound();

            isTesting = true;
            toggleBtn.disabled = true;
            toggleBtn.textContent = "Midiendo Red...";
            speedValue.textContent = "0.00";
            pingValue.textContent = "-- ms";
            uploadValue.textContent = "-- Mbps";

            try {
                // 1. PRUEBA DE PING
                statusText.textContent = "Midiendo Ping...";
                statusText.style.color = "#ffcc00";
                
                let pingStart = performance.now();
                await fetch('https://speed.cloudflare.com/__down?bytes=0', { cache: 'no-store' });
                let pingEnd = performance.now();
                let pingTime = Math.round(pingEnd - pingStart);
                pingValue.textContent = `${pingTime} ms`;

                // 2. PRUEBA DE DESCARGA (DOWNLOAD)
                statusText.textContent = "Midiendo Descarga...";
                let animInterval = setInterval(() => {
                    speedValue.textContent = (Math.random() * 90 + 5).toFixed(2);
                }, 80);

                const downUrl = "https://speed.cloudflare.com/__down?bytes=5000000";
                let downStart = performance.now();
                const downResponse = await fetch(downUrl + "&cache=" + Math.random());
                const downBlob = await downResponse.blob();
                let downEnd = performance.now();
                
                clearInterval(animInterval);

                let downDuration = (downEnd - downStart) / 1000;
                let downBits = downBlob.size * 8;
                let speedMbps = ((downBits / downDuration) / (1024 * 1024)).toFixed(2);
                speedValue.textContent = speedMbps;

                // Actualizar Gráfica
                const now = new Date().toLocaleTimeString().split(':').slice(0, 2).join(':');
                speedChart.data.labels.push(now);
                speedChart.data.datasets[0].data.push(speedMbps);
                if (speedChart.data.labels.length > 10) {
                    speedChart.data.labels.shift();
                    speedChart.data.datasets[0].data.shift();
                }
                speedChart.update();

                // 3. PRUEBA DE SUBIDA (UPLOAD)
                statusText.textContent = "Midiendo Subida...";
                let uploadDataSize = 2000000;
                let uploadData = new Uint8Array(uploadDataSize);
                
                let upStart = performance.now();
                await fetch('https://speed.cloudflare.com/__up', {
                    method: 'POST',
                    body: uploadData,
                    cache: 'no-store'
                }).catch(() => {});
                let upEnd = performance.now();

                let upDuration = (upEnd - upStart) / 1000;
                let upBits = uploadDataSize * 8;
                let upMbps = upDuration > 0 ? ((upBits / upDuration) / (1024 * 1024)).toFixed(2) : (speedMbps * 0.3).toFixed(2);
                uploadValue.textContent = `${upMbps} Mbps`;

                // Estado final
                if (speedMbps > 20) {
                    statusText.textContent = "⚡ La Red es Rápida y Estable";
                    statusText.style.color = "#00ffcc";
                } else if (speedMbps > 5) {
                    statusText.textContent = "⚠️ La Red es Moderada";
                    statusText.style.color = "#ffcc00";
                } else {
                    statusText.textContent = "❌ Red Lenta e Inestable";
                    statusText.style.color = "#ff4d4d";
                }

            } catch (error) {
                statusText.textContent = "⚠️ Error en la prueba de conexión";
                statusText.style.color = "#ff4d4d";
                speedValue.textContent = "0.00";
            } finally {
                isTesting = false;
                toggleBtn.disabled = false;
                toggleBtn.textContent = "Volver a Analizar";
            }
        }

        toggleBtn.addEventListener('click', startSpeedTest);
    </script>
</body>
</html>
